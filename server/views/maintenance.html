<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="refresh" content="60">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>Court Replay - Temporariamente indisponível</title>
  <style>
    :root { --bg:#f5f5f7; --surface:#fff; --text:#1d1d1f; --text-2:#6e6e73; --accent:#0071e3; --shadow:0 2px 6px rgba(0,0,0,.05),0 12px 32px rgba(0,0,0,.08); }
    @media (prefers-color-scheme: dark) { :root { --bg:#000; --surface:#1c1c1e; --text:#f5f5f7; --text-2:#a1a1a6; --accent:#2997ff; --shadow:0 0 0 1px rgba(255,255,255,.06); } }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); text-align: center; -webkit-font-smoothing: antialiased; letter-spacing: -0.011em;
    }
    .card { width: min(440px, 100%); padding: 48px 32px; background: var(--surface); border-radius: 28px; box-shadow: var(--shadow); }
    .icon { width: 64px; height: 64px; margin: 0 auto 24px; border-radius: 18px; display: grid; place-items: center; color: #fff; background: linear-gradient(145deg, #3aa0ff, #0a5fd6); }
    h1 { font-size: 26px; line-height: 1.15; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 12px; }
    p { color: var(--text-2); line-height: 1.5; }
    p + p { margin-top: 6px; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.4 2.4-2.1-.6-.6-2.1z"/>
      </svg>
    </div>
    <h1>Site temporariamente indisponível</h1>
    <p>Estamos em manutenção. Volte em alguns minutos.</p>
    <p>Esta página atualiza sozinha.</p>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Court Replay</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
        </span>
        Court Replay
      </div>
      <div class="status-pill" id="statusPill" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="label" id="statusLabel">Conectando…</span>
      </div>
    </div>
  </header>

  <main class="container">
    <header class="page-header">
      <div>
        <div class="eyebrow">Hoje</div>
        <h1>Seus replays</h1>
        <p class="page-sub">Reveja, assista e baixe as suas jogadas.</p>
      </div>
      <button class="btn btn-secondary" id="refreshBtn" aria-label="Atualizar lista">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        <span class="label">Atualizar</span>
      </button>
    </header>

    <div class="notice-banner" role="note">
      <div class="notice-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
      </div>
      <div class="notice-text">
        <strong>Os clips ficam disponíveis até as 00:00</strong>
        <p>Todos os clips são removidos automaticamente à meia-noite. Baixe o que precisar antes disso.</p>
      </div>
    </div>

    <section class="search-section" aria-label="Filtrar por horário">
      <div class="chips" id="chips" role="group" aria-label="Atalhos de horário">
        <button class="chip" type="button" data-preset="all" aria-pressed="true">Dia todo</button>
        <button class="chip" type="button" data-preset="hour" aria-pressed="false">Última hora</button>
        <button class="chip" type="button" data-preset="morning" aria-pressed="false">Manhã</button>
        <button class="chip" type="button" data-preset="afternoon" aria-pressed="false">Tarde</button>
        <button class="chip" type="button" data-preset="night" aria-pressed="false">Noite</button>
      </div>
      <div class="search-row">
        <div class="search-field">
          <label for="searchStart">De</label>
          <input type="time" id="searchStart" value="00:00" min="00:00" max="23:59">
        </div>
        <div class="search-field">
          <label for="searchEnd">Até</label>
          <input type="time" id="searchEnd" value="23:59" min="00:00" max="23:59">
        </div>
        <button class="btn btn-primary" id="searchBtn">Pesquisar</button>
        <button class="btn btn-secondary" id="clearBtn">Limpar</button>
      </div>
    </section>

    <div class="results-count" id="resultsCount" aria-live="polite"></div>

    <div class="clips-grid" id="clipsGrid" aria-busy="true">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </main>

  <div class="modal" id="videoModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Replay</h3>
        <div class="modal-actions">
          <button class="btn btn-primary btn-sm" id="modalDownload">Baixar</button>
          <button class="modal-close" id="modalClose" aria-label="Fechar">&times;</button>
        </div>
      </div>
      <div class="modal-body">
        <video id="previewVideo" controls playsinline></video>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="/js/app.js"></script>
</body>
</html>

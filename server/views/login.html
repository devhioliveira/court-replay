<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Court Replay - Entrar</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <span class="brand-mark" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
        </span>
        <h1>Court Replay</h1>
      </div>
      <p class="login-subtitle">Entre para ver seus replays.</p>
      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="username">Usuário</label>
          <input type="text" id="username" name="username" required autocomplete="username" autocapitalize="none">
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <div id="loginError" class="error-message" style="display:none;" role="alert"></div>
        <button type="submit" class="btn btn-primary btn-block">
          <span class="btn-text">Entrar</span>
          <span class="btn-loading" style="display:none;">
            <svg class="spinner" width="20" height="20" viewBox="0 0 24 24" style="color:#fff">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="31.4 31.4"/>
            </svg>
          </span>
        </button>
      </form>
    </div>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>
